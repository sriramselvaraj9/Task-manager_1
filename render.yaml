services:
  # 1. Backend Web Service (FastAPI)
  - type: web
    name: taskmanager-backend
    env: python
    rootDir: backend
    buildCommand: pip install fastapi uvicorn sqlalchemy psycopg2-binary python-jose passlib groq openai python-dotenv
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskmanager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # 2. Frontend Static Site (Vite React)
  - type: web
    name: taskmanager-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 3. PostgreSQL Database
  - name: taskmanager-db
    databaseName: taskdb
    user: taskuser
