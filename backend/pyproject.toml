[project]
name = "backend"
version = "0.1.0"
description = "Task Manager Backend"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
    "sqlalchemy>=2.0.51",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "openai>=1.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
