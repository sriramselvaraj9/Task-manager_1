[project]
name = "backend"
version = "0.1.0"
description = "Task Manager Backend"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
    "sqlalchemy>=2.0.51",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
